[package]
name = "mos_rain"
version = "4.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "mos_rain — organic rain on window glass with convex-lens refraction and dispersion for EffectCraft (wasm plug-in, ABI 1)"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
